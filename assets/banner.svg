<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="bar-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic Waveform & Audio Spectrum Bars in Background -->
  <g class="wave-bars" opacity="0.35">
    <rect x="50" y="160" width="8" height="60" rx="4" fill="url(#bar-grad)"><animate attributeName="height" values="60;120;40;60" dur="2s" repeatCount="indefinite"/><animate attributeName="y" values="160;100;180;160" dur="2s" repeatCount="indefinite"/></rect>
    <rect x="70" y="140" width="8" height="100" rx="4" fill="url(#bar-grad)"><animate attributeName="height" values="100;40;140;100" dur="2.3s" repeatCount="indefinite"/><animate attributeName="y" values="140;200;100;140" dur="2.3s" repeatCount="indefinite"/></rect>
    <rect x="90" y="120" width="8" height="140" rx="4" fill="url(#bar-grad)"><animate attributeName="height" values="140;80;180;140" dur="1.8s" repeatCount="indefinite"/><animate attributeName="y" values="120;180;80;120" dur="1.8s" repeatCount="indefinite"/></rect>
    <rect x="110" y="100" width="8" height="180" rx="4" fill="url(#bar-grad)"><animate attributeName="height" values="180;60;120;180" dur="2.5s" repeatCount="indefinite"/><animate attributeName="y" values="100;200;140;100" dur="2.5s" repeatCount="indefinite"/></rect>
    <rect x="130" y="150" width="8" height="80" rx="4" fill="url(#bar-grad)"><animate attributeName="height" values="80;160;60;80" dur="2.1s" repeatCount="indefinite"/><animate attributeName="y" values="150;70;170;150" dur="2.1s" repeatCount="indefinite"/></rect>
    
    <rect x="1050" y="150" width="8" height="80" rx="4" fill="url(#bar-grad)"><animate attributeName="height" values="80;150;50;80" dur="1.9s" repeatCount="indefinite"/><animate attributeName="y" values="150;80;180;150" dur="1.9s" repeatCount="indefinite"/></rect>
    <rect x="1070" y="110" width="8" height="160" rx="4" fill="url(#bar-grad)"><animate attributeName="height" values="160;70;170;160" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y" values="110;190;90;110" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="1090" y="130" width="8" height="120" rx="4" fill="url(#bar-grad)"><animate attributeName="height" values="120;180;60;120" dur="1.7s" repeatCount="indefinite"/><animate attributeName="y" values="130;70;190;130" dur="1.7s" repeatCount="indefinite"/></rect>
    <rect x="1110" y="160" width="8" height="60" rx="4" fill="url(#bar-grad)"><animate attributeName="height" values="60;110;40;60" dur="2.2s" repeatCount="indefinite"/><animate attributeName="y" values="160;110;180;160" dur="2.2s" repeatCount="indefinite"/></rect>
  </g>

  <!-- Animated Sound Wave Line -->
  <path d="M 150,220 Q 300,140 450,220 T 750,220 T 1050,220" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.4">
    <animate attributeName="d" values="M 150,220 Q 300,140 450,220 T 750,220 T 1050,220; M 150,220 Q 300,280 450,220 T 750,220 T 1050,220; M 150,220 Q 300,140 450,220 T 750,220 T 1050,220" dur="5s" repeatCount="indefinite"/>
  </path>

  <!-- Foreground Title and Subtitle (Crisp & Readable) -->
  <g text-anchor="middle">
    <!-- Microphone Icon -->
    <g transform="translate(600, 75) scale(1.2)">
      <path d="M-12,-10 A12,12 0 0,1 12,-10 V10 A12,12 0 0,1 -12,10 Z" fill="#38bdf8" opacity="0.9"/>
      <path d="M-18,5 A18,18 0 0,0 18,5" fill="none" stroke="#e0e7ff" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="23" x2="0" y2="33" stroke="#e0e7ff" stroke-width="4" stroke-linecap="round"/>
      <line x1="-10" y1="33" x2="10" y2="33" stroke="#e0e7ff" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Main Title -->
    <text x="600" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="44" fill="url(#text-grad)" letter-spacing="1.5" filter="url(#glow)">
      Awesome Audio Recording Utility 🎙️
    </text>

    <!-- Subtitle -->
    <text x="600" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="19" fill="#94a3b8" letter-spacing="0.5">
      Curated Commercial Software, DAWs &amp; Open-Source Audio Tools
    </text>

    <!-- Category Badges / Pills -->
    <g transform="translate(600, 245)">
      <rect x="-240" y="0" width="140" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="-170" y="17" font-family="sans-serif" font-size="12" fill="#38bdf8" font-weight="600">🎙️ Recording</text>

      <rect x="-80" y="0" width="120" height="26" rx="13" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
      <text x="-20" y="17" font-family="sans-serif" font-size="12" fill="#818cf8" font-weight="600">🎛️ DAWs</text>

      <rect x="60" y="0" width="180" height="26" rx="13" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
      <text x="150" y="17" font-family="sans-serif" font-size="12" fill="#c084fc" font-weight="600">⭐ Open Source &amp; SaaS</text>
    </g>
  </g>
</svg>
